  今天心血来潮检查了一下以前部署的没人用的网页的可用性，结果发现两个应该在的服务掉线了（我甚至没注意到掉线邮件）
  <br/>
  排查日志发现有SSL自动申请的报错，提示acme验证失败，我以为是cf拦截了acme验证端点，于是折腾了一番发现关掉cf也不能验证
  <br/>
  最后发现是这俩服务在rn的机器上，之前DC02迁移的时候忘记改新的IP了，发现之后就严肃切换到CNAME解析了，这样我就只需要维护一个域名的IP就行了
